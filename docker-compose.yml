# MediDispatch GH - full stack
#
#   cp .env.example .env        # then fill in real secrets
#   docker compose up -d --build
#   docker compose exec web python scripts/seed_data.py
#
# Services: nginx (public) -> web (Flask/Gunicorn/Eventlet) -> postgres, redis, ollama

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"   # enable together with the TLS block in deploy/nginx/nginx.conf
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/srv/static:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medidispatch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medidispatch}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      SOCKETIO_ASYNC_MODE: eventlet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ollama is deliberately NOT a hard dependency: the app must start and
      # triage on MEWS rules even if the AI container is down.
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    command: >
      sh -c "flask --app 'app:create_app(\"production\")' init-db &&
             gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:8000
             --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile - wsgi:app"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medidispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medidispatch}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medidispatch} -d ${POSTGRES_DB:-medidispatch}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # For NVIDIA GPUs, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # One-shot job that downloads Llama 3.2 3B into the ollama volume.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

volumes:
  pg_data:
  redis_data:
  ollama_models:
  app_logs:
