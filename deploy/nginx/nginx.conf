# MediDispatch GH - reverse proxy (static files, WebSocket upgrade, limits)

worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;

    # Uploads: photos are capped at 6 MB by the app; leave a little headroom.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Basic abuse protection on the public, zero-login civilian API.
    limit_req_zone $binary_remote_addr zone=civilian:10m rate=30r/m;

    upstream medidispatch_web {
        server web:8000;
        # With several web replicas, enable sticky sessions for Socket.IO:
        # ip_hash;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # --- To enable HTTPS (required in production) ---------------------
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # and add a separate port-80 server that returns 301 to https.

        location /static/ {
            alias /srv/static/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        location /socket.io/ {
            proxy_pass http://medidispatch_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /civilian/api/ {
            limit_req zone=civilian burst=20 nodelay;
            proxy_pass http://medidispatch_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            proxy_pass http://medidispatch_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }
    }
}
