{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes" role="alert">
  {% for category, message in messages %}
  <div class="flash flash-{{ category if category in ['error','warning','success','info'] else 'info' }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
